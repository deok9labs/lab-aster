name: aster

services:
  aster:
    build:
      context: ..
    container_name: lab-aster-api
    env_file:
      # 기존 PostgreSQL과 동일한 자격 증명을 process 환경으로만 전달한다.
      - /opt/postgres/.env
    environment:
      ASTER_OPENAPI_ENABLED: "false"
      DB_HOST: db
      DB_PORT: 5432
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    container_name: lab-aster-nginx
    depends_on:
      - aster
    networks:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  backend:
    external: true
    name: postgres_backend
