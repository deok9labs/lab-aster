spring:
  application:
    name: lab-aster-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB:aster}}
    username: ${DB_USER:${POSTGRES_USER:aster_app}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    hibernate:
      # 데이터베이스 구조는 운영자가 관리하며 애플리케이션은 매핑 일치 여부만 확인한다.
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      # 정수 필드에 소수가 들어오면 소수점 이하를 버리지 않고 요청 오류로 거부한다.
      accept-float-as-int: false

springdoc:
  api-docs:
    enabled: ${ASTER_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${ASTER_OPENAPI_ENABLED:true}
